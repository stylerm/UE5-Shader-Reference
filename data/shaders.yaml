section_groups:

  # ════════════════════════════════════════════════════════════════════════════
  #  AREA 1 — HLSL REFERENCE
  # ════════════════════════════════════════════════════════════════════════════
  - title: "HLSL Reference"
    icon: "⚗"
    theme: ref
    sections:

      # ── SECTION 1: USF / USH RULES ─────────────────────────────────────────
      - id: usf-rules
        label: ".usf / .ush File Rules"
        priority: high
        cards:

          - color: blue
            title: "File Structure Basics"
            content:
              - type: checklist
                items:
                  - {icon: ok, html: "Use <strong><code>#pragma once</code></strong> or <code>#ifndef</code>/<code>#define</code> include guards"}
                  - {icon: ok, html: "Include <strong><code>/Engine/Public/Platform.ush</code></strong> as the base header"}
                  - {icon: ok, html: "Declare module macro: <strong><code>YOURMODULE_API</code></strong>"}
                  - {icon: ok, html: "Use <strong>virtual shader path</strong> mapping for plugin custom paths"}
                  - {icon: ok, html: "<code>.ush</code> = header (shared types/helpers) · <code>.usf</code> = source (entry points)"}

          - color: orange
            title: "Include Guard Pattern"
            content:
              - type: code
                src: |
                  // Option A: pragma once
                  #pragma once

                  // Option B: traditional guards
                  #ifndef MY_SHADER_COMMON_USH
                  #define MY_SHADER_COMMON_USH

                  #include "/Engine/Public/Platform.ush"
                  #include "/MyPlugin/Private/MyCommon.ush"

                  // Shared types and helpers here
                  struct FMyData {
                    float3 Position;
                    float  Radius;
                    float  Intensity;
                    uint   Flags;
                  };

                  #endif // MY_SHADER_COMMON_USH

          - color: yellow
            title: "Platform &amp; Feature Guards"
            content:
              - type: code
                src: |
                  // Feature level guard
                  #if FEATURE_LEVEL >= FEATURE_LEVEL_SM5
                    // SM5+ only code (compute, UAV, etc.)
                  #endif

                  // SM6-only features
                  #if FEATURE_LEVEL >= FEATURE_LEVEL_SM6
                    // WaveOps, RayQuery, etc.
                  #endif

                  // Platform-specific
                  #if COMPILER_HLSL
                    // HLSL-specific path
                  #elif COMPILER_GLSL || COMPILER_GLSL_ES3_1
                    // Mobile / OpenGL path
                  #endif

                  // Vulkan-specific
                  #if VULKAN_PROFILE
                    // Vulkan workarounds
                  #endif

      # ── SECTION 2: COMPUTE ─────────────────────────────────────────────────
      - id: compute
        label: "Compute Shader Patterns"
        priority: high
        cards:

          - color: green
            title: "Compute Shader Entry Point"
            content:
              - type: code
                src: |
                  #include "/Engine/Public/Platform.ush"
                  #include "/MyPlugin/Private/MyCommon.ush"

                  // Thread group sizing
                  #define NUM_THREADS_X 8
                  #define NUM_THREADS_Y 8

                  // Resource bindings
                  Texture2D<float4>   InputTexture;
                  RWTexture2D<float4> OutputTexture;
                  uint Resolution;

                  [numthreads(NUM_THREADS_X, NUM_THREADS_Y, 1)]
                  void MainCS(
                      uint3 DispatchThreadID : SV_DispatchThreadID,
                      uint3 GroupThreadID   : SV_GroupThreadID,
                      uint3 GroupID         : SV_GroupID)
                  {
                    uint x = DispatchThreadID.x;
                    uint y = DispatchThreadID.y;
                    if (x >= Resolution || y >= Resolution)
                      return;

                    // Read, process, write
                    float4 Val = InputTexture.Load(int3(x, y, 0));
                    OutputTexture[uint2(x, y)] = Val;
                  }

          - color: red
            title: "Compute · Common Mistakes"
            content:
              - type: checklist
                items:
                  - {icon: no,   html: "<strong>Missing bounds check</strong> — always guard: <code>if (x >= Res || y >= Res) return;</code>"}
                  - {icon: no,   html: "<strong>Wrong dispatch size</strong> — dispatch = ceil(Resolution / ThreadGroupSize)"}
                  - {icon: no,   html: "<strong>UAV format mismatch</strong> — RWTexture format must match what C++ creates"}
                  - {icon: no,   html: "<strong>Missing barriers</strong> — always <code>GroupMemoryBarrierWithGroupSync()</code> after TGSM writes"}
                  - {icon: no,   html: "<strong>No <code>ddx</code>/<code>ddy</code></strong> in compute — these are pixel shader only"}
                  - {icon: warn, html: "<strong>Thread group size</strong> — 8×8 is common; 16×16 may exceed shared memory limits"}

          - color: green
            title: "See the dispatch geometry"
            content:
              - type: raw
                html: |
                  <a class="viz-ref" href="visuals.html#threadgroups">
                    <span class="viz-ref-badge">03</span>
                    Threadgroup dispatch grid · drag the slider to hit the 65,535 X-axis remap
                  </a>

          - color: blue
            title: "Resource Types"
            content:
              - type: rowlist
                rows:
                  - {label: "Texture2D<T>",           text: "Read-only texture (SRV)"}
                  - {label: "RWTexture2D<T>",          text: "Read-write texture (UAV)"}
                  - {label: "Buffer<T>",               text: "Read-only typed buffer (SRV)"}
                  - {label: "RWBuffer<T>",             text: "Read-write typed buffer (UAV)"}
                  - {label: "StructuredBuffer<T>",     text: "Read-only structured buffer"}
                  - {label: "RWStructuredBuffer<T>",   text: "Read-write structured buffer"}
                  - {label: "SamplerState",            text: "Texture sampler (bilinear, point, etc.)"}

      # ── SECTION 3: TGSM ────────────────────────────────────────────────────
      - id: tgsm
        label: "Thread Group Shared Memory (TGSM)"
        cards:

          - color: orange
            title: "TGSM Pattern"
            content:
              - type: prose
                text: "Use <code>groupshared</code> memory to share data between threads in a group, reducing global memory reads:"
              - type: code
                src: |
                  // Declare tile cache
                  #define TILE_DIM 10  // 8 + 1-pixel halo each side
                  groupshared float TileCache[TILE_DIM][TILE_DIM];

                  // 1. Load tile from global memory
                  int2 LoadPos = GroupID.xy * 8
                    + GroupThreadID.xy - 1;  // halo offset
                  LoadPos = clamp(LoadPos,
                    int2(0,0), int2(Res-1,Res-1));
                  TileCache[GroupThreadID.y][GroupThreadID.x]
                    = SourceGrid.Load(int3(LoadPos, 0)).r;

                  // 2. Sync all threads
                  GroupMemoryBarrierWithGroupSync();

                  // 3. Read from cache (fast)
                  float Center = TileCache[ly][lx];
                  float Left   = TileCache[ly][lx-1];
                  float Right  = TileCache[ly][lx+1];

          - color: yellow
            title: "TGSM Rules"
            content:
              - type: checklist
                items:
                  - {icon: ok,   html: "<strong><code>groupshared</code></strong> keyword declares shared memory — visible to all threads in group"}
                  - {icon: ok,   html: "<strong>Always sync</strong> with <code>GroupMemoryBarrierWithGroupSync()</code> between write and read"}
                  - {icon: ok,   html: "<strong>Halo loading</strong> — load 1+ pixel border around tile for stencil operations"}
                  - {icon: ok,   html: "<strong>Memory budget</strong> — 32KB per thread group on most GPUs; float[10][10] = 400 bytes"}
                  - {icon: warn, html: "<strong>Bank conflicts</strong> — stride of 32 floats causes conflicts; pad arrays if needed"}
                  - {icon: warn, html: "<strong>Boundary clamping</strong> — halo loads must clamp to grid bounds to avoid OOB reads"}

          - color: orange
            title: "See thread group layout"
            content:
              - type: raw
                html: |
                  <a class="viz-ref" href="visuals.html#threadgroups">
                    <span class="viz-ref-badge">03</span>
                    Threadgroup dispatch grid · see how X×Y groups tile across the work domain
                  </a>

          - color: green
            title: "TGSM Macro Pattern"
            content:
              - type: prose
                text: "Use macros to make TGSM reusable across passes:"
              - type: code
                src: |
                  // Declare macro for float tiles
                  #define DECLARE_TILE_CACHE_FLOAT(Name) \
                    groupshared float Name[TILE_DIM][TILE_DIM]

                  // Load macro with scroll compensation
                  #define LOAD_TILE_SCROLLED(Cache, Tex, ...) \
                    { /* load with offset + clamp */ \
                      GroupMemoryBarrierWithGroupSync(); }

                  // Usage in compute shader
                  DECLARE_TILE_CACHE_FLOAT(SDFCache);
                  LOAD_TILE_SCROLLED(SDFCache, SDFTex, ...);


      # ── SECTION: GPU ATOMICS ───────────────────────────────────────────────
      - id: atomics
        label: "GPU Atomics &amp; Lock-Free Composition"
        cards:

          - color: blue
            title: "HLSL Has No Float Atomics"
            content:
              - type: prose
                text: "<code>InterlockedMin</code>, <code>InterlockedMax</code> and <code>InterlockedAdd</code> are defined on <code>int</code> and <code>uint</code> only. Any pass where many threads composite into the same texel — stamping, splatting, rasterising into a grid — hits this immediately."
              - type: checklist
                items:
                  - {icon: "no",  html: "<strong>A float UAV has no atomic min.</strong> Two threads writing the same texel race, and the winner is whichever finished last — not the smallest value."}
                  - {icon: warn, cost: expensive, difficulty: advanced, html: "<strong>The CAS loop works but scales badly.</strong> <code>InterlockedCompareExchange</code> in a spin loop is correct, but every contending thread retries — cost climbs with overlap, which is exactly when you need it."}
                  - {icon: ok,   cost: free, difficulty: intermediate, html: "<strong>The bit trick is one instruction.</strong> IEEE-754 floats already compare correctly as integers <em>within</em> a sign — flip the negative half and the whole range becomes a monotonic <code>uint</code> key."}
                  - {icon: arrow, html: "SM6 adds <code>NvInterlockedAddFp32</code> and vendor equivalents, but they are extensions — not portable across the platforms UE ships to."}

          - color: orange
            title: "Order-Preserving float → uint"
            content:
              - type: prose
                text: "Non-negative floats: set the sign bit so they sort above every negative. Negative floats: flip <em>all</em> bits, which both moves them below zero and reverses their (otherwise backwards) magnitude ordering."
              - type: code
                src: |
                  uint FloatToOrderedUint(float Dist)
                  {
                      uint u = asuint(Dist);
                      // Negative: flip all bits. Non-negative: set the sign bit.
                      return (u & 0x80000000u) ? ~u : (u | 0x80000000u);
                  }

                  float OrderedUintToFloat(uint Encoded)
                  {
                      // High bit set -> was non-negative -> clear it. Else undo the full flip.
                      return asfloat((Encoded & 0x80000000u) ? (Encoded & 0x7FFFFFFFu) : ~Encoded);
                  }

                  // Compositing many overlapping stamps into one grid, lock-free:
                  RWTexture2D<uint> InputGrid;

                  void StampTexel(uint2 Pixel, float SignedDistance)
                  {
                      uint Encoded = FloatToOrderedUint(SignedDistance);
                      uint Prev;
                      InterlockedMin(InputGrid[Pixel], Encoded, Prev);
                  }
              - type: checklist
                items:
                  - {icon: ok, html: "The mapping is a <strong>bijection</strong> — every float round-trips exactly, including negative interiors and both zeros."}
                  - {icon: warn, html: "<strong>The clear value must be encoded too.</strong> Clearing the grid to <code>0</code> means \"the most negative float representable\", so every later <code>InterlockedMin</code> is a no-op and the field stays empty."}

          - color: blue
            span: grid-full
            title: "Interactive — watch the ordering break, then hold"
            content:
              - type: viz-atomic-order
                title: "Float → Orderable uint"
                number: "C1"
                caption: >
                  The same seven floats in value order (top) and in uint-key
                  order (bottom). Under raw asuint() the negatives jump to the
                  top of the uint range and invert — every crossed line is a
                  comparison InterlockedMin would get wrong. Toggle to ENCODED
                  and the lines run parallel.

          - color: green
            title: "When to Reach For This"
            content:
              - type: checklist
                items:
                  - {icon: ok, cost: cheap, difficulty: intermediate, html: "<strong>Scatter rasterisation</strong> — N sources writing into one grid where the result is a min, max, or sum. Removes the read-modify-write race without a second pass."}
                  - {icon: ok, cost: cheap, difficulty: beginner, html: "<strong>GPU-side reductions</strong> — bounding boxes, depth extents, histogram peaks. Encode once, reduce with integer atomics, decode at the consumer."}
                  - {icon: ok, cost: free, difficulty: intermediate, html: "<strong>Order-independent compositing</strong> — the result no longer depends on dispatch order, so the pass is deterministic frame to frame."}
                  - {icon: arrow, html: "For <code>InterlockedAdd</code> on floats there is no equivalent trick — the encoding preserves <em>order</em>, not arithmetic. Use fixed-point (<code>int</code> scaled by <m>1000</m>) or a separate reduction pass."}

          - color: red
            title: "What This Costs You"
            content:
              - type: checklist
                items:
                  - {icon: "no", html: "<strong>Atomic min is a hard min.</strong> Smooth blending between overlapping sources is impossible in the atomic pass — <code>smin()</code> is not associative under an atomic. Blend in a later gather pass if you need it."}
                  - {icon: "no", html: "<strong>The grid is now <code>R32_UINT</code>.</strong> Every consumer must decode, and you lose filtered sampling — a <code>uint</code> texture cannot be bilinearly sampled."}
                  - {icon: warn, html: "<strong>Debug views show garbage</strong> until decoded. Budget a debug-blit pass, or you will be reading raw bit patterns in RenderDoc."}

      # ── SECTION 4: REFERENCE ───────────────────────────────────────────────
      - id: reference
        label: "Quick Reference"
        cards:

          - color: blue
            title: "Feature Level Capabilities"
            content:
              - type: table
                style: feature_matrix
                cols: ["Feature", "ES3.1", "SM5", "SM6"]
                rows:
                  - ["Wave Intrinsics",   "✗", "✗", "✓"]
                  - ["RayQuery / DXR",    "✗", "✗", "✓"]
                  - ["ddx / ddy",         "✗", "✓", "✓"]
                  - ["Bindless Resources","✗", "✗", "✓"]
                  - ["half precision",    "✓", "✓", "✓"]
                  - ["Compute / UAV",     "✗", "✓", "✓"]
                  - ["Geometry Shaders",  "✗", "✓", "✓"]
                  - ["TGSM (groupshared)","✗", "✓", "✓"]
                  - ["Typed SRV Buffers", "✗", "✓", "✓"]

          - color: orange
            title: "UE Type Keywords &amp; Hints"
            content:
              - type: rowlist
                rows:
                  - {label: "MaterialFloat", text: "Adapts precision per platform automatically"}
                  - {label: "half / half3",  text: "16-bit — use on mobile for performance"}
                  - {label: "float / float3",text: "32-bit — default for PC / console"}
                  - {label: "BRANCH",        text: "<code>[branch]</code> hint — forces dynamic branching"}
                  - {label: "FLATTEN",       text: "<code>[flatten]</code> hint — forces both paths evaluated"}
                  - {label: "UNROLL",        text: "<code>[unroll]</code> — unroll loop at compile time"}
                  - {label: "LOOP",          text: "<code>[loop]</code> — force dynamic loop (required for dynamic bounds)"}

          - color: red
            title: "Common Shader Errors"
            content:
              - type: checklist
                items:
                  - {icon: no,   html: "Matrix multiply order — HLSL is <strong>row-vector × matrix</strong>; GLSL is column-major"}
                  - {icon: no,   html: "<strong>Missing include guard</strong> — double-include causes redefinition errors"}
                  - {icon: no,   html: "<strong>Virtual path mismatch</strong> — <code>/MyPlugin/</code> must match <code>AddShaderSourceDirectoryMapping</code>"}
                  - {icon: no,   html: "<strong>Uninitialized groupshared</strong> — TGSM is undefined until written"}
                  - {icon: no,   html: "<strong>Integer division</strong> — <code>1/2 = 0</code>; cast to float explicitly: <code>1.0/2.0</code>"}
                  - {icon: warn, html: "<strong>Scalar broadcast</strong> — <code>float3(1)</code> is valid HLSL but prefer <code>float3(1,1,1)</code> for clarity; some older compiler versions warn"}

      # ── SECTION 5: SAMPLING ────────────────────────────────────────────────
      - id: sampling
        label: "Texture Sampling &amp; SDF Patterns"
        cards:

          - color: blue
            title: "Sampling Methods"
            content:
              - type: code
                src: |
                  // Load (integer coords, no filtering)
                  float4 Val = Tex.Load(int3(x, y, 0));

                  // SampleLevel (UV coords, explicit mip)
                  float4 Val = Tex.SampleLevel(Sampler, UV, 0);

                  // In Material Custom Node:
                  // Texture2DSample(Tex, TexSampler, UV)
                  // Texture2DSampleLevel(Tex, TexSampler, UV, Lod)

                  // External texture (registered via GUID)
                  int32 TexCode = Compiler->ExternalTexture(GUID);
                  int32 Sample  = Compiler->TextureSample(
                    TexCode, UVCode, SAMPLERTYPE_External);

          - color: orange
            title: "Central-Difference Gradient"
            content:
              - type: prose
                text: "Compute gradient from a scalar field (e.g. SDF distance):"
              - type: code
                src: |
                  // Read neighbors
                  float Left  = Grid.Load(int3(max(x-1, 0),      y, 0)).r;
                  float Right = Grid.Load(int3(min(x+1, Res-1),  y, 0)).r;
                  float Up    = Grid.Load(int3(x, max(y-1, 0),      0)).r;
                  float Down  = Grid.Load(int3(x, min(y+1, Res-1),  0)).r;

                  // Central difference
                  float2 Gradient = float2(Right - Left, Down - Up);
                  float  Len = length(Gradient);
                  if (Len > 0.001)
                    Gradient /= Len;  // Normalize

                  // Output: R=dist, GB=direction, A=mag
                  OutputRT[Pixel] = float4(
                    NormDist, Gradient.x, Gradient.y, Len);

          - color: green
            title: "SDF Math Helpers"
            content:
              - type: code
                src: |
                  // Smooth minimum (polynomial blend)
                  float SmoothMin(float a, float b, float k)
                  {
                    if (k <= 0.0) return min(a, b);
                    float h = saturate(0.5 + 0.5 * (b - a) / k);
                    return lerp(b, a, h) - k * h * (1.0 - h);
                  }

                  // Distance to point
                  float PointDist(float2 P, float2 C, float R)
                  {
                    return length(P - C) - R;
                  }

                  // Distance to line segment
                  float SegmentDist(float2 P,
                      float2 A, float2 B, float R)
                  {
                    float2 AB = B - A;
                    float  t  = saturate(dot(P - A, AB) / dot(AB, AB));
                    return length(P - A - AB * t) - R;
                  }


      # ── SECTION: ORBITAL RINGS EXAMPLE ────────────────────────────────────
      - id: orbital-rings
        label: "Example: Orbital Rings"
        grid: "grid grid-2"
        cards:

          - color: blue
            span: grid-full
            title: "Orbital Rings — Procedural SDF Effect"
            content:
              - type: viz-orbit
                number: "EX"
                title: "Orbital Rings — Live WebGL Preview"
                caption: "Three tilted orbits rendered as approximate SDF ellipses with exponential glow. Near arc brighter; far arc dimmer."

          - color: orange
            title: "GLSL — WebGL / ShaderToy"
            content:
              - type: prose
                text: "Fragment shader — paste at shadertoy.com or wrap in any WebGL boilerplate. ShaderToy mainImage signature."
              - type: code
                src: |
                  // ── Orbital Rings ── GLSL / ShaderToy ──────────────────────────────────
                  // iResolution, iTime provided by ShaderToy; supply as uniforms otherwise.
                  // Each ring has its own radius, inclination, precession speed,
                  // and body-dot angular speed.

                  void mainImage(out vec4 fragColor, in vec2 fragCoord) {
                      vec2 uv = (fragCoord - 0.5 * iResolution.xy)
                                / min(iResolution.x, iResolution.y);
                      float T = iTime;

                      // Deep warm background with soft vignette
                      vec3 col = vec3(0.055, 0.028, 0.014) * (1.0 - 0.45 * length(uv));

                      // Warm pedestal glow (bottom pool)
                      col += vec3(0.98, 0.42, 0.08)
                             * exp(-length(uv - vec2(0.0, -0.55)) * 2.8) * 0.9;
                      col += vec3(0.55, 0.18, 0.03)
                             * exp(-length(uv - vec2(0.0, -0.85)) * 1.3) * 0.55;

                      // Central sun / planet
                      float r = length(uv);
                      col += vec3(1.00, 0.95, 0.82) * smoothstep(0.040, 0.024, r);
                      col += vec3(0.90, 0.55, 0.22) * exp(-r * 11.0) * 0.35;
                      col += vec3(0.40, 0.20, 0.06) * exp(-r *  3.5) * 0.28;

                      // Three rings — each with its own tilt, speed, and orbital body
                      for (int i = 0; i < 3; i++) {
                          float rad, incl, oSpeed, bSpeed, phO, phB;
                          if (i == 0)      { rad=0.27; incl=0.38; oSpeed= 0.180;
                                             bSpeed= 1.30; phO= 0.2; phB=0.0; }
                          else if (i == 1) { rad=0.42; incl=0.98; oSpeed=-0.110;
                                             bSpeed= 0.85; phO= 1.8; phB=1.7; }
                          else             { rad=0.58; incl=1.24; oSpeed= 0.065;
                                             bSpeed=-0.55; phO=-0.6; phB=3.2; }

                          float O   = oSpeed * T + phO;   // precession angle (Ω)
                          float thB = bSpeed * T + phB;   // body angle along ring

                          // Rotate pixel into ring-local frame (major axis → X)
                          float co = cos(O), so = sin(O);
                          vec2 p = vec2(uv.x*co + uv.y*so, -uv.x*so + uv.y*co);

                          // Tilted circle → ellipse on screen
                          float ci = cos(incl);
                          vec2 radii = vec2(rad, rad * abs(ci));
                          vec2 pn = p / radii;
                          float d = abs(length(pn) - 1.0) * min(radii.x, radii.y);

                          // Near/far-of-sun shading (using parametric angle's 3D z)
                          float alpha_s = clamp(p.y / max(radii.y, 1e-4), -1.0, 1.0);
                          float depth   = alpha_s * sin(incl);
                          float nearT   = smoothstep(-0.7, 0.7, depth);

                          float core = exp(-d * 420.0);           // sharp line
                          float glow = exp(-d *  55.0) * 0.35;    // soft aura
                          float aura = exp(-d *  16.0) * 0.08;    // wide halo
                          vec3 rc = mix(vec3(0.22, 0.38, 0.72),   // far-side: cool
                                        vec3(1.00, 0.98, 0.92),   // near-side: warm-white
                                        nearT);
                          col += rc * (core + glow + aura) * (0.35 + 0.65 * nearT);

                          // Orbital body (small bright dot on the ring)
                          float bc = cos(thB), bs = sin(thB);
                          vec2  bodyLocal = vec2(rad * bc, rad * bs * ci);
                          float bDepth = bs * sin(incl);
                          float bDist  = length(p - bodyLocal);
                          float front  = smoothstep(-0.05, 0.05, bDepth);
                          float bCore  = smoothstep(0.022, 0.009, bDist);
                          float bGlow  = exp(-bDist * 22.0) * 0.32;
                          vec3  bCol   = mix(vec3(0.45, 0.60, 0.90),
                                             vec3(1.00, 0.95, 0.80), front);
                          col += bCol * (bCore + bGlow) * (0.30 + 0.70 * front);
                      }

                      col = pow(clamp(col, 0.0, 1.0), vec3(0.45));
                      fragColor = vec4(col, 1.0);
                  }

          - color: green
            title: "HLSL — Unreal Custom Material Node"
            content:
              - type: prose
                text: "Paste into a Custom node (return type float3). Wire TexCoord[0] → UV, a Time node → T. Connect output to Emissive Color."
              - type: code
                src: |
                  // ── Orbital Rings ── HLSL / Unreal Custom Node ─────────────────────────
                  // Inputs:
                  //   UV  (float2) ← TexCoord[0]
                  //   T   (float)  ← Time node
                  // Output type: CMOT Float 3 — wire to Emissive Color

                  float2 uv = UV * 2.0 - 1.0;  // assumes square; divide x by aspect if not

                  // Deep warm background + vignette
                  float3 col = float3(0.055, 0.028, 0.014) * (1.0 - 0.45 * length(uv));

                  // Warm pedestal glow (bottom)
                  col += float3(0.98, 0.42, 0.08)
                         * exp(-length(uv - float2(0.0, -0.55)) * 2.8) * 0.9;
                  col += float3(0.55, 0.18, 0.03)
                         * exp(-length(uv - float2(0.0, -0.85)) * 1.3) * 0.55;

                  // Central sun / planet
                  float r = length(uv);
                  col += float3(1.00, 0.95, 0.82) * smoothstep(0.040, 0.024, r);
                  col += float3(0.90, 0.55, 0.22) * exp(-r * 11.0) * 0.35;
                  col += float3(0.40, 0.20, 0.06) * exp(-r *  3.5) * 0.28;

                  // Three rings — each with its own tilt, precession, and body speed
                  for (int i = 0; i < 3; i++) {
                      float rad, incl, oSpeed, bSpeed, phO, phB;
                      if (i == 0)      { rad=0.27; incl=0.38; oSpeed= 0.180;
                                         bSpeed= 1.30; phO= 0.2; phB=0.0; }
                      else if (i == 1) { rad=0.42; incl=0.98; oSpeed=-0.110;
                                         bSpeed= 0.85; phO= 1.8; phB=1.7; }
                      else             { rad=0.58; incl=1.24; oSpeed= 0.065;
                                         bSpeed=-0.55; phO=-0.6; phB=3.2; }

                      float O   = oSpeed * T + phO;
                      float thB = bSpeed * T + phB;

                      // Rotate pixel into ring-local frame
                      float co = cos(O), so = sin(O);
                      float2 p = float2(uv.x*co + uv.y*so, -uv.x*so + uv.y*co);

                      // Tilted circle → ellipse
                      float  ci    = cos(incl);
                      float2 radii = float2(rad, rad * abs(ci));
                      float2 pn    = p / radii;
                      float  d     = abs(length(pn) - 1.0) * min(radii.x, radii.y);

                      // Near/far shading via parametric angle → 3D depth
                      float alpha_s = clamp(p.y / max(radii.y, 1e-4), -1.0, 1.0);
                      float depth   = alpha_s * sin(incl);
                      float nearT   = smoothstep(-0.7, 0.7, depth);

                      float core = exp(-d * 420.0);
                      float glow = exp(-d *  55.0) * 0.35;
                      float aura = exp(-d *  16.0) * 0.08;
                      float3 rc  = lerp(float3(0.22, 0.38, 0.72),
                                        float3(1.00, 0.98, 0.92), nearT);
                      col += rc * (core + glow + aura) * (0.35 + 0.65 * nearT);

                      // Orbital body dot
                      float  bc = cos(thB), bs = sin(thB);
                      float2 bodyLocal = float2(rad * bc, rad * bs * ci);
                      float  bDepth    = bs * sin(incl);
                      float  bDist     = length(p - bodyLocal);
                      float  front     = smoothstep(-0.05, 0.05, bDepth);
                      float  bCore     = smoothstep(0.022, 0.009, bDist);
                      float  bGlow     = exp(-bDist * 22.0) * 0.32;
                      float3 bCol      = lerp(float3(0.45, 0.60, 0.90),
                                              float3(1.00, 0.95, 0.80), front);
                      col += bCol * (bCore + bGlow) * (0.30 + 0.70 * front);
                  }

                  return pow(clamp(col, 0.0, 1.0), 0.45);
              - type: raw
                html: |
                  <figure class="example-img">
                    <img src="Resources/orbital-rings-ue5.png"
                         alt="Orbital rings effect running in the Unreal Engine 5 material editor">
                    <figcaption>The same shader pasted into an Unreal Custom material node — wired to Emissive Color.</figcaption>
                  </figure>

          - color: yellow
            span: grid-full
            title: "GLSL → HLSL Translation Notes"
            content:
              - type: checklist
                items:
                  - {icon: arrow, html: "<code>vec2 / vec3 / vec4</code> &rarr; <code>float2 / float3 / float4</code> — identical layout, different keyword"}
                  - {icon: arrow, html: "<code>mix(a, b, t)</code> &rarr; <code>lerp(a, b, t)</code> — same argument order"}
                  - {icon: arrow, html: "<code>fract(x)</code> &rarr; <code>frac(x)</code>"}
                  - {icon: arrow, html: "<code>mod(x, y)</code> &rarr; <code>fmod(x, y)</code>"}
                  - {icon: arrow, html: "<code>iTime</code> / <code>iResolution</code> removed — use a <strong>Time</strong> node input; UV is already 0&ndash;1 in Unreal"}
                  - {icon: arrow, html: "<code>void mainImage(out vec4 fragColor, ...)</code> &rarr; <code>return float3</code>; set Custom node output type to <strong>CMOT Float3</strong>"}
                  - {icon: arrow, html: "<code>float(i)</code> &rarr; <code>(float)i</code> — C-style cast; both compile fine in SM5"}
                  - {icon: warn, html: "UV aspect ratio: GLSL divides by <code>min(res.x, res.y)</code> to keep orbits circular. The HLSL version uses <code>UV*2-1</code> which is square-only — divide <code>uv.x</code> by the aspect ratio for non-square plane meshes"}
                  - {icon: warn, html: "Loops in Custom nodes require <strong>SM5+</strong> — not available on ES3.1 (mobile). For mobile, unroll manually or use a Material Function per ring"}

  # ════════════════════════════════════════════════════════════════════════════
  #  AREA 2 — IN-ENGINE OPTIMIZATION
  # ════════════════════════════════════════════════════════════════════════════
  - title: "In-Engine Optimization"
    icon: "⚡"
    theme: optim
    sections:

      # ── SECTION 6: COMPUTE PERFORMANCE ────────────────────────────────────
      - id: compute-perf
        label: "Compute Shader Performance Rules"
        cards:

          - color: green
            title: "Occupancy &amp; ALU"
            content:
              - type: checklist
                items:
                  - {icon: ok,   html: "<strong>Target 75%+ GPU occupancy</strong> — reduce register pressure by reusing temporaries and simplifying arithmetic chains"}
                  - {icon: ok,   html: "<strong>Thread group size 8×8 (64 threads)</strong> — safe on all targets including mobile ES3.1 and SM5 desktop"}
                  - {icon: warn, html: "<strong>16×16 (256 threads)</strong> — risks exceeding 32KB shared memory limit on some mobile/integrated GPUs; test explicitly"}
                  - {icon: ok,   html: "<strong>Minimize register use</strong> — declare variables inside loop bodies where possible; fewer live registers = higher occupancy"}
                  - {icon: warn, html: "<strong>Avoid branch divergence</strong> — if half the threads take each side of an <code>if</code>, you pay 2× the cost; restructure with <code>lerp</code> / <code>select</code>"}

          - color: orange
            title: "Memory Bandwidth"
            content:
              - type: checklist
                items:
                  - {icon: ok,   html: "<strong>TGSM is the primary bandwidth tool</strong> — load a tile of data once into groupshared, read it many times within the group"}
                  - {icon: ok,   html: "<strong>Coalesce global reads/writes</strong> — adjacent threads should access adjacent memory addresses (stride-1 access patterns)"}
                  - {icon: no,   html: "<strong>Scattered UAV writes are slow</strong> — random-address writes break GPU memory coalescing; prefer sorted or sequential indices"}
                  - {icon: no,   html: "<strong>Never read/write the same UAV in one dispatch</strong> — use ping-pong buffers (read A, write B; next frame swap)"}
                  - {icon: ok,   html: "<strong>Minimize RW texture round-trips</strong> — avoid dispatches that write a texture and immediately read it in the same pass"}

          - color: blue
            span: grid-full
            title: "Thread Group Size Cheat Sheet"
            content:
              - type: table
                style: default
                cols: ["Size", "Threads", "TGSM Budget", "Recommended For"]
                rows:
                  - ["`8×8×1`",   "64",  "~1.6KB float",  "Safe on all targets — textures, SDF, general 2D"]
                  - ["`8×8×1`",   "64",  "~3.2KB float2", "Gradient / neighbor reads with halo"]
                  - ["`16×16×1`", "256", "~6.4KB float",  "PC/SM5+ only — larger tiles, reduce dispatch overhead"]
                  - ["`64×1×1`",  "64",  "—",             "1D passes: histograms, prefix sums, buffer ops"]
                  - ["`32×1×1`",  "32",  "—",             "Mobile-safe 1D — matches warp/wavefront size"]


      # ── SECTION: SCATTER VS GATHER DISPATCH ───────────────────────────────
      - id: scatter-gather
        label: "Scatter vs Gather Dispatch"
        cards:

          - color: blue
            title: "The Two Dispatch Shapes"
            content:
              - type: prose
                text: "Any \"N sources affect a grid\" pass can be written from either end. The choice is not stylistic — it changes the asymptotic cost, and the crossover comes earlier than most people expect."
              - type: table
                style: default
                cols: ["Shape", "One thread is", "Cost", "Good when"]
                rows:
                  - ["<strong>Gather</strong>", "one <em>texel</em>, looping every source", "<code>grid × N</code>", "N is tiny and fixed, or every source covers the whole grid"]
                  - ["<strong>Scatter</strong>", "one <em>texel inside one source's bounding rect</em>", "<code>Σ footprints</code>", "sources are local — the normal case for stamps, decals, splats, impacts"]
              - type: checklist
                items:
                  - {icon: warn, html: "Gather cost is <strong>independent of where the sources are</strong>. Ten stamps in one corner still cost ten full-grid loops."}
                  - {icon: ok,   html: "Scatter cost tracks <strong>coverage</strong>. Sources that touch nothing cost nothing."}

          - color: orange
            title: "The 3D Dispatch Trick"
            content:
              - type: prose
                text: "Scatter needs each thread to know <em>which source</em> it belongs to. Rather than an indirection buffer, put the source index on the dispatch's Z axis: X/Y cover the bounding rect, Z runs one slice per source."
              - type: code
                src: |
                  // Dispatch(ceil(MaxFootprint / 8), ceil(MaxFootprint / 8), StampCount)
                  [numthreads(8, 8, 1)]
                  void MainCS(uint3 DispatchThreadID : SV_DispatchThreadID)
                  {
                      uint StampIndex = DispatchThreadID.z + StampIndexOffset;
                      if (StampIndex >= StampCount)
                          return;

                      FPointStamp S = PointStamps[StampIndex];

                      // Thread's texel = this stamp's bounding-rect origin + local offset.
                      int2 Origin = int2(floor((S.Position - S.Radius - GridOrigin) / GridScale));
                      int2 Pixel  = Origin + int2(DispatchThreadID.xy);
                      if (any(Pixel < 0) || any(Pixel >= int2(Resolution, Resolution)))
                          return;

                      float Dist = EvaluateStamp(S, Pixel);
                      uint  Prev;
                      InterlockedMin(InputGrid[Pixel], FloatToOrderedUint(Dist), Prev);
                  }
              - type: checklist
                items:
                  - {icon: warn, cost: moderate, difficulty: intermediate, html: "<strong>X/Y must cover the <em>largest</em> footprint</strong>, so one huge source drags every slice up with it. That is the whole reason for the next card."}
                  - {icon: ok, html: "<code>StampIndexOffset</code> rebases Z, which lets you issue several dispatches over disjoint index ranges without touching the shader."}

          - color: green
            title: "Bucket by Footprint"
            content:
              - type: prose
                text: "Sort sources into two or three size buckets and issue one dispatch per bucket. Each dispatch sizes X/Y to <em>its own</em> largest member, so small stamps stop paying for the big one."
              - type: checklist
                items:
                  - {icon: ok, cost: cheap, difficulty: intermediate, html: "<strong>Two or three buckets is enough.</strong> The win is removing the worst outlier, not perfectly packing every size class — more buckets just adds dispatch overhead."}
                  - {icon: ok, cost: free, difficulty: beginner, html: "<strong>Sort on the CPU</strong> while you are already walking the source list to upload it. The sort is over tens of entries, not thousands."}
                  - {icon: arrow, html: "Cost goes from <code>N × largest footprint</code> to roughly <code>Σ footprints</code> — the number the scatter shape promised in the first place."}

          - color: blue
            span: grid-full
            title: "Interactive — drag the stamp count and watch the ratio"
            content:
              - type: viz-scatter-gather
                title: "Scatter vs Gather Dispatch"
                number: "C2"
                caption: >
                  Highlighted cells are texels that actually run a thread.
                  Gather lights the whole grid and multiplies by the stamp
                  count; scatter lights only the bounding rects. The ratio chip
                  is the real eval-count quotient — add stamps and it grows,
                  because gather scales with N and scatter scales with coverage.

          - color: yellow
            title: "What Scatter Costs You"
            content:
              - type: checklist
                items:
                  - {icon: warn, html: "<strong>Overlapping sources now collide.</strong> Two threads can target one texel, so the composite must be an <a href=\"#atomics\">atomic</a> — which means a hard min/max, not a smooth blend."}
                  - {icon: warn, html: "<strong>Occupancy drops at the rect edges.</strong> A circular source in a square rect wastes the corners; that waste is bounded at <m>21%</m> and still far cheaper than gather."}
                  - {icon: "no",  html: "<strong>Do not scatter global sources.</strong> Anything whose footprint is the whole grid — ambient wind, a full-screen decay — belongs in the gather pass that follows."}
                  - {icon: ok,   html: "<strong>Keep both.</strong> Scatter the local sources, then run one cheap full-grid pass for the global terms. That is the standard split."}

  # ════════════════════════════════════════════════════════════════════════════
  #  AREA 3 — ENGINE INTERNALS (Dispatch / Resource / Platform Reference)
  # ════════════════════════════════════════════════════════════════════════════
  - title: "Engine Internals"
    icon: "🔬"
    theme: engine
    sections:

      # ── SECTION 7: DISPATCH & RESOURCE RULES ──────────────────────────────
      - id: dispatch-rules
        label: "Dispatch &amp; Resource Rules"
        grid: "grid grid-2"
        cards:

          - color: orange
            span: grid-full
            title: "Dispatch Setup Rules"
            content:
              - type: rowlist
                layout: stacked
                rows:
                  - {label: "Dispatch size", text: "<code>ceil(Resolution / ThreadGroupSize)</code> — never dispatch without a bounds check inside the shader; out-of-bounds threads must return early"}
                  - {label: "Ping-pong buffers", text: "Never read and write the same UAV in a single dispatch — use two separate buffers (A and B) and swap which one is read vs written each frame"}
                  - {label: "Async compute", text: "Overlap GPU work (e.g. shadow depth pass + simulation) using the async compute queue — reduces overall frame latency without extra CPU cost"}
                  - {label: "RDG resources", text: "Use <code>FRDGBuilder</code> to declare textures and buffers — the Render Dependency Graph handles barrier insertion and lifetime automatically"}
                  - {label: "Indirect dispatch", text: "Use when dispatch dimensions are determined on the GPU (e.g. particle counts) — avoids an expensive CPU readback stall"}

          - color: yellow
            title: "RDG (Render Dependency Graph) Patterns"
            content:
              - type: prose
                text: "UE5 native render pass system — always prefer RDG over manual render commands:"
              - type: code
                src: |
                  // Declare RDG texture
                  FRDGTextureRef OutputTex = GraphBuilder.CreateTexture(
                    FRDGTextureDesc::Create2D(
                      FIntPoint(Width, Height),
                      PF_FloatRGBA,
                      FClearValueBinding::Black,
                      TexCreate_UAV | TexCreate_ShaderResource),
                    TEXT("MyOutputTexture"));

                  // Pass parameters
                  FMyShaderParameters* PassParams =
                    GraphBuilder.AllocParameters<FMyShaderParameters>();
                  PassParams->OutputTexture =
                    GraphBuilder.CreateUAV(OutputTex);

                  // Add compute pass
                  GraphBuilder.AddPass(
                    RDG_EVENT_NAME("MyComputePass"),
                    PassParams,
                    ERDGPassFlags::Compute,
                    [PassParams, Width, Height](FRHIComputeCommandList& RHICmdList)
                    {
                      // Dispatch here
                    });

          - color: blue
            title: "Profiling Compute Shaders"
            content:
              - type: rowlist
                layout: stacked
                rows:
                  - {label: "stat gpu", text: "Console command — shows GPU time per pass; look for your pass name from <code>RDG_EVENT_NAME</code>"}
                  - {label: "RenderDoc", text: "Frame capture tool — inspect every dispatch, view UAV contents, check thread occupancy"}
                  - {label: "GPU Insights (5.4+)", text: "Built-in Unreal Insights GPU view — shows compute pass durations on a timeline"}
                  - {label: "r.RDG.Debug 1", text: "Enables RDG validation — catches missing barriers, resource aliasing, and UAV hazards"}
                  - {label: "profilegpu", text: "Console command — dumps per-pass GPU timings to the output log"}


      # ── SECTION: PERSISTENT GPU SIMULATION ────────────────────────────────
      - id: persistent-sim
        label: "Persistent GPU Simulation"
        cards:

          - color: blue
            span: grid-full
            title: "The Shape of a Persistent Sim Frame"
            content:
              - type: prose
                text: "A simulation that carries state between frames — a distance field, a fluid grid, a heightmap of deformation — is not a single dispatch. It is a fixed chain, and the chain is the same whatever the sim is actually solving."
              - type: rowlist
                rows:
                  - {label: "0 · Clear", text: "Reset the per-frame accumulator to its <em>neutral</em> value — which is rarely zero. Skippable when nothing wrote last frame."}
                  - {label: "1 · Inject", text: "Scatter this frame's external influences into the accumulator. See <a href=\"#scatter-gather\">Scatter vs Gather</a>."}
                  - {label: "2 · Integrate", text: "Merge the accumulator into the persistent state, then advance it — advection, relaxation, decay. Reads state A, writes state B."}
                  - {label: "3 · Solve", text: "Any iterative step: pressure projection, Eikonal sweeps, diffusion. This is where the frame budget actually goes."}
                  - {label: "4 · Blit", text: "Derive the consumer-facing surface — gradients, normals, packed channels — into a texture materials and Niagara can sample."}
              - type: checklist
                items:
                  - {icon: warn, html: "<strong>Steps 2 and 3 must never read and write one resource</strong> unless the access pattern is provably disjoint. That constraint drives every decision below."}
                  - {icon: ok,   html: "<strong>Keep the consumer surface stable across modes.</strong> If a cheap mode and an expensive mode both publish the same texture with the same channel meaning, materials never learn which one is running."}

          - color: orange
            title: "Ping-Pong Is the Default, Not the Only Option"
            content:
              - type: checklist
                items:
                  - {icon: ok,   cost: moderate, difficulty: beginner, html: "<strong>Ping-pong</strong> — allocate A and B, read A write B, swap. Correct for any stencil, and the only option when a thread reads neighbours it does not own."}
                  - {icon: warn, cost: moderate, html: "<strong>It costs a full second copy of the state.</strong> At <m>1024²</m> RGBA16F that is <m>8 MB</m> per grid — and iterative solvers want several."}
                  - {icon: ok,   cost: cheap, difficulty: advanced, html: "<strong>Parity splitting removes the second buffer</strong> when the stencil only touches immediate neighbours — see the red/black card."}
                  - {icon: "no", html: "<strong>Never alias a ping-pong pair to save memory.</strong> RDG will not catch it, and the corruption is frame-rate dependent."}

          - color: orange
            span: grid-full
            title: "Red/Black — Gauss-Seidel Without a Second Buffer"
            content:
              - type: prose
                text: "Split the grid by <code>(x + y) &amp; 1</code>. A pass writes only its own parity, and the four neighbours it reads are all the other parity — so within one dispatch nothing that is written is read. One UAV, no hazard, and each pass sees the previous pass's fresh values, which is what makes it Gauss-Seidel rather than Jacobi."
              - type: code
                src: |
                  uint                Resolution;
                  float               Alpha;      // -(dx)^2
                  float               InvBeta;    // 0.25
                  float               SORWeight;  // omega in [1.0, 1.95]; 1.7 near-optimal
                  uint                PassIndex;  // 0 = red (x+y even), 1 = black (odd)
                  Texture2D<float2>   DivergenceGrid;
                  RWTexture2D<float>  PressureGrid;   // read AND written in the same dispatch

                  [numthreads(8, 8, 1)]
                  void MainCS(uint3 DispatchThreadID : SV_DispatchThreadID)
                  {
                      if (any(DispatchThreadID.xy >= Resolution))
                          return;

                      int2 Pixel = int2(DispatchThreadID.xy);

                      // Skip the cells that belong to the other pass.
                      if ((((uint)Pixel.x + (uint)Pixel.y) & 1u) != PassIndex)
                          return;

                      int Res = int(Resolution);
                      float pL = PressureGrid[int2(max(Pixel.x - 1, 0),       Pixel.y)];
                      float pR = PressureGrid[int2(min(Pixel.x + 1, Res - 1), Pixel.y)];
                      float pD = PressureGrid[int2(Pixel.x, max(Pixel.y - 1, 0))];
                      float pU = PressureGrid[int2(Pixel.x, min(Pixel.y + 1, Res - 1))];

                      float b       = DivergenceGrid.Load(int3(Pixel, 0)).r;
                      float pJacobi = (pL + pR + pD + pU + Alpha * b) * InvBeta;

                      // SOR: over-relax past the Jacobi estimate.
                      float pOld = PressureGrid[Pixel];
                      PressureGrid[Pixel] = pOld + SORWeight * (pJacobi - pOld);
                  }
              - type: table
                style: default
                cols: ["Scheme", "Buffers", "Spectral radius ρ (N=256)", "Relative"]
                rows:
                  - ["Jacobi", "2", "<code>cos(π/N)</code> ≈ <m>0.99976</m>", "baseline"]
                  - ["Red/Black Gauss-Seidel", "1", "<code>ρ_J²</code> ≈ <m>0.99952</m>", "≈ <m>2×</m> faster per iteration"]
                  - ["Red/Black SOR (ω = 1.7)", "1", "≈ <m>0.967</m>", "≈ <m>8–12×</m> faster"]
              - type: checklist
                items:
                  - {icon: ok,   cost: free, difficulty: intermediate, html: "<strong>Two dispatches per outer iteration</strong> — red then black. RDG inserts the UAV barrier between them, which is exactly the ordering the scheme depends on."}
                  - {icon: warn, html: "<strong>ω is not free to pick.</strong> Above <m>2.0</m> the iteration diverges; near-optimal is problem-dependent but <m>1.7</m> is a sane default for a 2D Poisson solve."}
                  - {icon: "no",  html: "<strong>Do not use this for a wide stencil.</strong> The moment a thread reads a cell of its own parity — a 3×3 blur, a two-ring gather — the disjointness argument collapses and you need ping-pong back."}

          - color: blue
            span: grid-full
            title: "Interactive — parity split vs the two-buffer sweep"
            content:
              - type: viz-redblack
                title: "Red/Black In-Place Relaxation"
                number: "C3"
                caption: >
                  Step between the red and black passes. White is the cell the
                  highlighted thread writes; green rings are the four it reads —
                  all of them the opposite parity, so none was touched this
                  dispatch. Toggle to JACOBI to see the same solve pay for a
                  second full-resolution buffer.

          - color: green
            title: "Three Cheap Wins on Any Iterative Solve"
            content:
              - type: checklist
                items:
                  - {icon: ok, cost: free, difficulty: beginner, html: "<strong>Warm-start.</strong> Do not clear the solution between frames — last frame's answer is a far better initial guess than zero. Clear only on init and on resize."}
                  - {icon: ok, cost: cheap, difficulty: intermediate, html: "<strong>Solve at half resolution.</strong> Downsample the right-hand side, solve, sample the result back up bilinearly. A pressure field is smooth; the error this introduces is well below what the advection step contributes."}
                  - {icon: ok, cost: free, difficulty: intermediate, html: "<strong>Scale iteration count by dt.</strong> A fixed iteration count means the far field propagates at a frame-rate-dependent speed. Author against <m>60</m> fps and scale, clamped to a sane range."}
                  - {icon: warn, cost: situational, difficulty: advanced, html: "<strong>Async compute</strong> overlaps the solve with unrelated graphics work — shadow depth, base pass. RDG demotes it to the graphics queue where the platform cannot honour it, so the fallback is automatic but the win is not guaranteed."}

          - color: blue
            span: grid-full
            title: "Interactive — the dirty rect that makes an idle sim free"
            content:
              - type: viz-activity-rect
                title: "Activity Rect · Dilate, Decay, Skip"
                number: "C4"
                caption: >
                  Scrub the timeline. The CPU tracks a bounding rect of
                  everything written since the field was last empty and dilates
                  it one texel per frame — the speed the relaxation front
                  travels. When the field has decayed the rect expires and the
                  entire dispatch is skipped, which is what makes a persistent
                  sim cost nothing while nothing is happening.

          - color: green
            title: "Dispatch Less, Then Dispatch Nothing"
            content:
              - type: checklist
                items:
                  - {icon: ok, cost: cheap, difficulty: advanced, html: "<strong>Track an activity rect on the CPU.</strong> Union of every source's bounds since the field was last empty; dilate it per frame by however far information travels in one step; clamp to the grid."}
                  - {icon: ok, cost: free, difficulty: intermediate, html: "<strong>Skip the whole frame when idle.</strong> No pending sources, no registered writers, no debug consumer, and the field has had time to decay — then issue nothing at all. This is the single largest win available and it is pure bookkeeping."}
                  - {icon: warn, html: "<strong>Fall back to full-grid on the cases that break the invariant</strong> — first frame after init, resize, a parameter change that alters propagation speed, or any external writer you do not track. A wrong rect is a corrupt field, not a slow one."}
                  - {icon: arrow, html: "The rect only pays off when sources are <em>local</em>. A sim driven by a full-screen source is always full-grid; do not add the bookkeeping."}

          - color: red
            span: grid-full
            title: "Two Failures That Do Not Report Themselves"
            content:
              - type: gotcha
                variant: full
                problem: "A compute pass that samples the Global Distance Field returns zero everywhere, but only outside the renderer's own passes."
                why: "The GDF is bound as part of the <em>view</em> uniform buffer. Materials and Niagara can read it because they execute inside the renderer with a view bound; a standalone sim dispatch has no view and silently samples nothing."
                why_ref: "GetDistanceToNearestSurfaceGlobal"
                fix: "Bake it. Add an <code>FSceneViewExtension</code>, dispatch at <code>PostRenderBasePassDeferred</code> where the view <em>is</em> bound, sample the GDF into your own texture, and have the sim read that texture next frame."
                detect: "Values are exactly <m>0</m> — not noisy, not partially correct. If a debug blit of the same sample inside a material shows real distances, the difference is the view binding, not the sampling code."
              - type: gotcha
                variant: full
                problem: "GPU crash or device-removed at high element counts, in a pass that works fine at low counts."
                why: "An indirect-args buffer was never initialised. The draw or dispatch read whatever was in memory as its count, and a garbage vertex count is an out-of-bounds read — which is a page fault, not a validation error."
                fix: "Clear the args buffer to <code>{0, 0, 0, 0}</code> on allocation and leave it in the indirect-args state; let the producing pass overwrite it each frame. Separately, clamp any GPU-derived group count to <m>65535</m> before it reaches a dispatch."
                detect: "Failure scales with element count and disappears on a fresh allocation. <code>r.RDG.Debug 1</code> will not flag it — RDG tracks transitions, not buffer <em>contents</em>."

      # ── SECTION 8: PLATFORM PERFORMANCE ───────────────────────────────────
      - id: platform-perf
        label: "Platform-Specific Performance Notes"
        cards:

          - color: blue
            title: "SM5 / SM6 Desktop"
            content:
              - type: checklist
                items:
                  - {icon: ok,   tags: [SM6], html: "<strong>Wave intrinsics (SM6)</strong> — <code>WaveActiveSum</code>, <code>WaveActiveBallot</code> for prefix sums and culling; no atomic lock needed"}
                  - {icon: ok,   tags: [SM6], html: "<strong>Bindless resources (SM6)</strong> — large descriptor heaps; avoid per-draw binding changes on DX12 / Vulkan"}
                  - {icon: ok,   tags: [Desktop], html: "<strong><m>16×16</m> thread groups safe</strong> — desktop GPUs have ≥<m>32KB</m> shared memory and high register files"}
                  - {icon: warn, tags: [SM6], html: "<strong>RayQuery (SM6)</strong> — only available in compute/pixel shaders with DXR-enabled hardware and feature level SM6"}

          - color: orange
            title: "Mobile (ES3.1)"
            content:
              - type: checklist
                items:
                  - {icon: ok,   tags: [Mobile, ES3.1], html: "<strong>Use <code>half</code> precision</strong> — mobile GPUs process 16-bit at <m>2×</m> the throughput of 32-bit"}
                  - {icon: no,   tags: [Mobile, ES3.1], html: "<strong>No compute / UAV</strong> on ES3.1 — compute shaders require at minimum Feature Level SM5; mobile = vertex + pixel only"}
                  - {icon: no,   tags: [Mobile, ES3.1], html: "<strong>No <code>ddx</code> / <code>ddy</code></strong> — derivatives are unavailable in ES3.1 pixel shaders too; approximate with explicit UV derivatives"}
                  - {icon: warn, tags: [Mobile, ES3.1], html: "<strong><m>16</m> sampler cap</strong> — total texture samples (all stages) must stay under <m>16</m> on most mobile GPUs"}
                  - {icon: warn, tags: [Mobile], html: "<strong>Test with Mobile Preview</strong> — Editor viewport mode that simulates ES3.1 constraints without a device"}

          - color: yellow
            title: "Vulkan / Metal Specifics"
            content:
              - type: checklist
                items:
                  - {icon: ok,   tags: [Vulkan], html: "<strong><code>VULKAN_PROFILE</code> guard</strong> — use for Vulkan-specific workarounds (different NDC, subpass load, etc.)"}
                  - {icon: warn, tags: [Vulkan], html: "<strong>Explicit memory barriers on Vulkan</strong> — RDG handles these automatically; avoid raw <code>RHICmdList</code> transitions"}
                  - {icon: warn, tags: [Metal], html: "<strong>Metal tile shaders</strong> — available on Apple Silicon; no direct HLSL equivalent; use UE5 RHI abstraction"}
                  - {icon: ok,   tags: [Vulkan], html: "<strong>Vulkan subpass inputs</strong> — allows reading previous render pass output without a full texture read; great for deferred passes"}
